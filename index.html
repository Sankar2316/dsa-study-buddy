<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSA Study Buddy</title>
<style>
body{font-family:system-ui;background:#0b1220;color:#e5e7eb;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:16px;background:#111a2e;font-weight:700;font-size:20px}header span{color:#22d3ee}
#chat{flex:1;overflow:auto;padding:16px}.m{max-width:75%;padding:10px 14px;border-radius:12px;margin:8px 0;white-space:pre-wrap}
.u{background:#2563eb;margin-left:auto}.b{background:#1f2937}
form{display:flex;gap:8px;padding:12px;background:#111a2e}input{flex:1;padding:12px;border-radius:8px;border:0}
button{padding:12px 18px;border:0;border-radius:8px;background:#22d3ee;font-weight:700;cursor:pointer}
.chips button{background:#1f2937;color:#e5e7eb;margin:4px;padding:6px 10px;font-weight:400}
</style></head><body>
<header>🧠 DSA <span>Study Buddy</span> — Tutor · Quiz · Coach agents</header>
<div class="chips" style="padding:8px 12px">
<button onclick="send('Explain dynamic programming simply')">Explain DP</button>
<button onclick="send('Quiz me on graphs')">Quiz me: Graphs</button>
<button onclick="send('Show my progress and give a 3-day plan')">My plan</button></div>
<div id="chat"></div>
<form onsubmit="event.preventDefault();send(q.value)"><input id="q" placeholder="Ask a DSA doubt..."><button>Send</button></form>
<script>
const API="REPLACE_WITH_API_URL/chat";
let uid;try{uid=localStorage.getItem('uid')||("u"+Math.random().toString(36).slice(2,8));localStorage.setItem('uid',uid)}catch(e){uid="u"+Math.random().toString(36).slice(2,8)}
const chat=document.getElementById('chat');
const q=document.getElementById('q');
function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=1e9;return d}
async function send(t){if(!t||!t.trim())return;q.value='';add(t,'u');const w=add('Thinking...','b');
if(API.startsWith('REPLACE')){w.textContent='Preview mode: deploy.ps1 run pannina appram live reply varum.';return}
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,message:t})});
const j=await r.json();w.textContent=j.reply||j.error}catch(e){w.textContent='Error: '+e}}
</script></body></html>
